$kind: http-request
name: Create Movie
method: POST
url: '{{base_url}}/movies/'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "title": "Interstellar",
      "year": 2014,
      "genre": "Sci-Fi",
      "director": "Christopher Nolan",
      "plot": "A team of explorers travel through a wormhole in space in an attempt to ensure humanity's survival.",
      "imdb_rating": 8.6
    }
