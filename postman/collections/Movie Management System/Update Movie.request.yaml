$kind: http-request
name: Update Movie
method: PUT
url: '{{base_url}}/movies/:movieId'
order: 4000
headers:
  - key: Content-Type
    value: application/json
pathVariables:
  - key: movieId
    value: '1'
body:
  type: json
  content: |-
    {
      "title": "Inception",
      "year": 2010,
      "genre": "Sci-Fi / Thriller",
      "director": "Christopher Nolan",
      "plot": "A skilled thief is offered a chance to have his criminal record erased if he can successfully perform inception.",
      "imdb_rating": 8.8
    }
